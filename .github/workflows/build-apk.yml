name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "School server address the app starts with"
        required: true
        default: "http://192.168.1.25:8069"
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform folder
        run: flutter create --org com.bingoforge --project-name school_app --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          URL="${SERVER_URL:-http://192.168.1.25:8069}"
          flutter build apk --debug --dart-define=API_BASE_URL="$URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
