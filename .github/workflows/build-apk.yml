name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "School server address the app starts with"
        required: true
        default: "http://192.168.1.25:8069"
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform folder
        run: flutter create --org com.sameer --project-name school_app --platforms android .

      # Push notifications: paste the content of google-services.json (Firebase console) into the
      # repository secret GOOGLE_SERVICES_JSON. Without the secret the app is built without push.
      - name: Add Firebase (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Firebase needs Android 6.0 (API 23) or newer
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' android/app/build.gradle
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set - building without push notifications"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q '"package_name": "com.sameer.school_app"' android/app/google-services.json \
            || { echo "::error::google-services.json has no Android app com.sameer.school_app"; exit 1; }
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's#id("dev.flutter.flutter-plugin-loader") version "1.0.0"#&\n    id("com.google.gms.google-services") version "4.4.2" apply false#' android/settings.gradle.kts
            sed -i 's#id("dev.flutter.flutter-gradle-plugin")#&\n    id("com.google.gms.google-services")#' android/app/build.gradle.kts
          else
            sed -i 's#id "dev.flutter.flutter-plugin-loader" version "1.0.0"#&\n    id "com.google.gms.google-services" version "4.4.2" apply false#' android/settings.gradle
            sed -i 's#id "dev.flutter.flutter-gradle-plugin"#&\n    id "com.google.gms.google-services"#' android/app/build.gradle
          fi
          grep -n "google-services\|minSdk" android/settings.gradle* android/app/build.gradle*

      # Phone permissions the app needs. Added after the opening <manifest ...> tag whatever its
      # attributes are, and the build stops if any is missing (so an APK without them is never made).
      - name: Add phone permissions (notifications, bus tracking)
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          perms = ["POST_NOTIFICATIONS", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION",
                   "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_LOCATION", "WAKE_LOCK"]
          missing = [p for p in perms if f'android.permission.{p}"' not in xml]
          if missing:
              tag = re.search(r"<manifest\b[^>]*>", xml)
              if not tag:
                  raise SystemExit("No <manifest> tag found in " + path)
              lines = "".join(f'\n    <uses-permission android:name="android.permission.{p}"/>' for p in missing)
              xml = xml[:tag.end()] + lines + xml[tag.end():]
              open(path, "w", encoding="utf-8").write(xml)
          xml = open(path, encoding="utf-8").read()
          still = [p for p in perms if f'android.permission.{p}"' not in xml]
          if still:
              raise SystemExit("Permissions missing in manifest: " + ", ".join(still))
          print("Permissions OK:", ", ".join(perms))
          PY
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          URL="${SERVER_URL:-http://192.168.1.25:8069}"
          flutter build apk --debug --dart-define=API_BASE_URL="$URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
