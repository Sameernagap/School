name: school_app
description: School parent, student and teacher app for the Odoo school management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.2
  mobile_scanner: ^7.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  geolocator: ^14.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/login/
    - assets/login/icons/
